<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>頁面找不到 - 網站已全新改版</title>
  <!-- 5 秒後自動跳轉回首頁 -->
  <meta http-equiv="refresh" content="5;url=/">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      max-width: 480px;
      width: 100%;
    }
    h1 { font-size: 4rem; margin: 0; color: #0051c3; }
    h2 { font-size: 1.5rem; margin: 10px 0 20px; color: #222; }
    p { font-size: 1rem; color: #666; margin-bottom: 30px; line-height: 1.6; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background-color: #0051c3;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .btn:hover { background-color: #003688; }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>網站已全新改版</h2>
    <p>您所存取的舊頁面已不復存在。<br>系統將於 5 秒後自動引導您前往新版首頁。</p>
    <a href="/" class="btn">立即返回首頁</a>
  </div>
</body>
</html>
